[package]
name = "rawi_studio_rust"
version = "1.0.0"
edition = "2021"
authors = ["Rawi Studio"]
description = "استوديو الراوي لكتابة الروايات وبناء العوالم والخرائط الفانتازية بلغة Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
